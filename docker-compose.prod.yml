services:
  notification-service:
    image: docker.io/${IMAGE_REPOSITORY:-camilom959/fleetops-notification-service}:${IMAGE_TAG:-latest}
    container_name: fleetops-notification-service
    env_file: .env
    ports:
      - '3000:3000'
    volumes:
      - ./secrets:/run/secrets:ro
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
