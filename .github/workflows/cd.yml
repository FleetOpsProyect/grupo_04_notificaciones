name: CD - Despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  IMAGE_NAME: camilom959/fleetops-notification-service

jobs:
  verify:
    name: Verificación previa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Validar OpenAPI
        run: npm run openapi:validate

      - name: Pruebas con cobertura
        run: npm run test:coverage

  build:
    name: Construir y publicar imagen
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en EC2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Copiar compose a la instancia
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          source: docker-compose.prod.yml
          target: /opt/fleetops
          overwrite: true

      - name: Desplegar y verificar
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: IMAGE_TAG
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/fleetops

            PREVIOUS=""
            if [ -f .current_image ]; then
              PREVIOUS="$(cat .current_image)"
            fi

            echo "Desplegando imagen ${IMAGE_TAG} (anterior: ${PREVIOUS:-ninguna})"
            if [ -n "${PREVIOUS}" ]; then
              echo "${PREVIOUS}" > .previous_image
            fi
            IMAGE_TAG="${IMAGE_TAG}" docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG="${IMAGE_TAG}" docker compose -f docker-compose.prod.yml up -d --remove-orphans
            echo "${IMAGE_TAG}" > .current_image

            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/health >/dev/null \
                && curl -fsS http://127.0.0.1:3000/ready >/dev/null; then
                echo "Smoke correcto en el intento ${attempt}"
                exit 0
              fi
              sleep 5
            done

            echo "Smoke falló; iniciando rollback" >&2
            docker compose -f docker-compose.prod.yml logs --tail=100 notification-service || true
            if [ -n "${PREVIOUS}" ]; then
              IMAGE_TAG="${PREVIOUS}" docker compose -f docker-compose.prod.yml pull
              IMAGE_TAG="${PREVIOUS}" docker compose -f docker-compose.prod.yml up -d --remove-orphans
              echo "${IMAGE_TAG}" > .previous_image
              echo "${PREVIOUS}" > .current_image
              echo "Rollback a ${PREVIOUS} completado" >&2
            else
              echo "No hay imagen anterior para rollback" >&2
            fi
            exit 1
